<svg class="ba-dia" width="500" height="440" viewBox="0 0 500 440" fill="none" role="img" aria-label="Beş araç grubunun Ücretsiz Araçlar merkezine bağlandığı ağ şeması; dosyalar tarayıcıda kalır"><style>.bd-orb{transform-box:view-box;transform-origin:250px 220px;animation:bdSpin 70s linear infinite}.bd-flow{stroke-dasharray:3 13;animation:bdFlow 1.8s linear infinite}.bd-pulse{transform-box:view-box;transform-origin:250px 220px;animation:bdPulse 3.6s ease-out infinite}.bd-p2{animation-delay:1.8s}.bd-halo{animation:bdHalo 2.6s ease-in-out infinite}.bd-lit{animation:bdLit 2.6s ease-in-out infinite}.bd-core{transform-box:view-box;transform-origin:250px 220px;animation:bdFloat 4.5s ease-in-out infinite}.bd-coreglow{animation:bdGlowRing 2.6s ease-in-out infinite}.bd-shine{animation:bdShine 3.8s ease-in-out infinite}@keyframes bdLit{0%,100%{stroke:#B35A6B}50%{stroke:#5E3039}}@keyframes bdSpin{to{transform:rotate(360deg)}}@keyframes bdFlow{to{stroke-dashoffset:-32}}@keyframes bdPulse{0%{transform:scale(.62);opacity:.6}100%{transform:scale(1.55);opacity:0}}@keyframes bdHalo{0%,100%{opacity:.55}50%{opacity:.12}}@keyframes bdFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.03)}}@keyframes bdGlowRing{0%,100%{opacity:.15;stroke-width:2}50%{opacity:.8;stroke-width:3.5}}@keyframes bdShine{0%,55%{transform:skewX(-20deg) translateX(0)}100%{transform:skewX(-20deg) translateX(260px)}}@media (prefers-reduced-motion:reduce){.bd-orb,.bd-flow,.bd-pulse,.bd-halo,.bd-lit,.bd-core,.bd-coreglow,.bd-shine{animation:none}}</style><defs><radialGradient id="bdGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7B2331" stop-opacity=".26"/><stop offset="1" stop-color="#7B2331" stop-opacity="0"/></radialGradient><linearGradient id="bdCore" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8E2C3C"/><stop offset="1" stop-color="#5E1A25"/></linearGradient><linearGradient id="bdShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="bdClip"><rect x="170" y="189" width="160" height="62" rx="8"/></clipPath></defs><circle cx="250" cy="220" r="200" fill="url(#bdGlow)"/><circle class="bd-orb" cx="250" cy="220" r="165" stroke="#44474D" stroke-width="1.5" stroke-dasharray="2 9"/><circle cx="250" cy="220" r="96" stroke="#33363B" stroke-width="1"/><line x1="250" y1="220" x2="93" y2="169" stroke="#383B41" stroke-width="1.6"/><line class="bd-flow" x1="250" y1="220" x2="93" y2="169" stroke="#CBCCCF" stroke-width="1.8" stroke-linecap="round" style="animation-delay:0s"/><line x1="250" y1="220" x2="250" y2="55" stroke="#383B41" stroke-width="1.6"/><line class="bd-flow" x1="250" y1="220" x2="250" y2="55" stroke="#CBCCCF" stroke-width="1.8" stroke-linecap="round" style="animation-delay:-.35s"/><line x1="250" y1="220" x2="407" y2="169" stroke="#383B41" stroke-width="1.6"/><line class="bd-flow" x1="250" y1="220" x2="407" y2="169" stroke="#CBCCCF" stroke-width="1.8" stroke-linecap="round" style="animation-delay:-.7s"/><line x1="250" y1="220" x2="347" y2="354" stroke="#383B41" stroke-width="1.6"/><line class="bd-flow" x1="250" y1="220" x2="347" y2="354" stroke="#CBCCCF" stroke-width="1.8" stroke-linecap="round" style="animation-delay:-1.05s"/><line x1="250" y1="220" x2="153" y2="354" stroke="#383B41" stroke-width="1.6"/><line class="bd-flow" x1="250" y1="220" x2="153" y2="354" stroke="#CBCCCF" stroke-width="1.8" stroke-linecap="round" style="animation-delay:-1.4s"/>
